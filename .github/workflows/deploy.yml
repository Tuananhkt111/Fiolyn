name: Deploy

# Every push to master and every pull request into it runs `verify`.
# Only a push to master deploys, and only after `verify` passes.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Pushes to master share one group: a newer push cancels the older run outright, verify included, so
# the newest commit is always the last image pushed to :latest. Each pull request has its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'master' || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/tuananhkt111/fiolyn

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test Fiolyn.sln -c Release

      - name: Docs lint
        run: bash scripts/docs-lint.sh

  build-and-deploy:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Fiolyn/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

      - name: Trigger Northflank deploy
        run: |
          status=$( curl -sS -o northflank-response.txt -w '%{http_code}' -X POST \
            "https://api.northflank.com/v1/projects/fiolyn/services/fiolyn/restart" \
            -H "Authorization: Bearer ${{ secrets.NORTHFLANK_API_TOKEN }}" \
            -H "Content-Type: application/json" )
          echo "Northflank restart: HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ] ; then
            cat northflank-response.txt ; echo
            echo "::error::Northflank refused the restart (HTTP $status). 401 or 403: renew NORTHFLANK_API_TOKEN."
            exit 1
          fi
