name: Deploy

on:
  push:
    branches: [master]

env:
  IMAGE_NAME: ghcr.io/tuananhkt111/fiolyn

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

      - name: Trigger Northflank deploy
        run: |
          curl -s -f -X POST \
            "https://api.northflank.com/v1/projects/fiolyn/services/fiolyn/restart" \
            -H "Authorization: Bearer ${{ secrets.NORTHFLANK_API_TOKEN }}" \
            -H "Content-Type: application/json"
