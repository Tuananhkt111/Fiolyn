name: Deploy

# Every push to master and every pull request into it runs `verify`.
# Only a push to master deploys, and only after `verify` passes.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  IMAGE_NAME: ghcr.io/tuananhkt111/fiolyn

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test Fiolyn.sln -c Release

      - name: Docs lint
        run: bash scripts/docs-lint.sh

  build-and-deploy:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Fiolyn/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

      - name: Trigger Northflank deploy
        run: |
          curl -s -f -X POST \
            "https://api.northflank.com/v1/projects/fiolyn/services/fiolyn/restart" \
            -H "Authorization: Bearer ${{ secrets.NORTHFLANK_API_TOKEN }}" \
            -H "Content-Type: application/json"
